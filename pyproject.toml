[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "borrarduplicados"
version = "1.0.1"
description = "Borrar duplicados: encuentra fotos iguales o parecidas y manda las sobrantes a la papelera"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
borrarduplicados = "borrarduplicados.__main__:main"

[tool.setuptools.packages.find]
include = ["borrarduplicados*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
