name: Versión Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # PySide6 6.5: las versiones nuevas de Qt no cargan en Windows Server 2016 / Windows 10 antiguos
          pip install "PySide6==6.5.3" . pyinstaller pytest
      - name: Pruebas
        run: python -m pytest -q
      - name: Armar el .exe
        run: pyinstaller --noconfirm --windowed --onedir --name "BorrarDuplicados" empaquetar/lanzador.py
      - name: Armar el instalador
        run: |
          choco install innosetup -y --no-progress
          $v = (python -c "import borrarduplicados; print(borrarduplicados.__version__)")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DVersion=$v" empaquetar\instalador.iss
      - name: Comprimir versión portable
        run: Compress-Archive -Path dist/BorrarDuplicados -DestinationPath BorrarDuplicados-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BorrarDuplicados-windows
          path: |
            dist/BorrarDuplicados-instalador.exe
            BorrarDuplicados-portable.zip
      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/BorrarDuplicados-instalador.exe BorrarDuplicados-portable.zip --title "Borrar duplicados ${{ github.ref_name }}" --notes "Windows: descarga BorrarDuplicados-instalador.exe y ábrelo."
